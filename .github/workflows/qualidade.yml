name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qualidade/package-lock.json
      - run: npm --prefix qualidade ci
      - run: npm --prefix qualidade run lint
