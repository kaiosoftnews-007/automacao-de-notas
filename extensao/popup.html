<!doctype html><meta charset="utf-8">
<style>body{font:14px Arial;width:300px;padding:12px;color:#172033}h1{font-size:15px;color:#1F3864;margin:0 0 10px}
input,select,button{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;font:inherit}
button{background:#1F3864;color:#fff;border:0;border-radius:6px;cursor:pointer}#msg{color:#B3261E;min-height:18px}small{color:#5A6678}</style>
<h1>Automação de Notas — Sefaz GO</h1>
<div id="fora"><input id="email" placeholder="E-mail do painel"><input id="senha" type="password" placeholder="Senha do painel"><button id="entrar">Entrar</button></div>
<div id="dentro" hidden>
  <div>Conectado: <b id="quem"></b></div>
  <label>Escritório<select id="esc"></select></label>
  <div id="sefaz" style="margin:8px 0;font-size:12px;color:#5A6678"></div>
  <small>Agora abra a Sefaz GO → Acesso Restrito → Baixar XML NFE. O painel azul aparece na tela.</small>
  <button id="sair" style="background:#5A6678;margin-top:10px">Sair</button>
</div>
<div id="msg"></div>
<script src="popup.js"></script>
